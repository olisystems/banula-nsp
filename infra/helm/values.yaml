oli-app:
  restartPolicy: Always

  image:
    repository: "swr.eu-de.otc.t-systems.com/oli_banula/banulanavigationservice"
    pullPolicy: IfNotPresent
    tag: ""

  imagePullSecrets:
    - name: default-secret

  service:
    name: banula-navigation-service-service
    type: ClusterIP
    port: 80
    containerPort: 8080

  env:
    SERVER_CONTEXT_PATH: "/nsp"
    NSP_LOG_PAYLOAD: "true"
    REMOTE_CHECK_ENABLED: "true"
    REMOTE_CHECK_INTERVAL: "3600000"
    REMOTE_CHECK_TIMEOUT: "10000"
    ACTIVE_STATE_CHECK_ENABLED: "true"
    ACTIVE_STATE_CHECK_CRON: "5 0 0 * * *"
    PLATFORM_URL: "http://platform-deban-service"
    PLATFORM_PARTY_ID: "BAN"
    PLATFORM_COUNTRY_CODE: "DE"

    ENVIRONMENT:
      configMapKeyRef:
        name: banula-nsp-config
        key: ENVIRONMENT
    SPRING_PROFILE:
      configMapKeyRef:
        name: banula-nsp-config
        key: SPRING_PROFILE
    NSP_URL:
      configMapKeyRef:
        name: banula-nsp-config
        key: NSP_URL

    MONGO_USER:
      secretKeyRef:
        name: mongodb-secret
        key: mongo_user
    MONGO_PASSWORD:
      secretKeyRef:
        name: mongodb-secret
        key: mongo_password
    MONGO_ENV:
      secretKeyRef:
        name: mongodb-secret
        key: mongo_env
    MONGO_ADDRESS:
      secretKeyRef:
        name: mongodb-secret
        key: mongo_address

  resources:
    requests:
      memory: 256Mi
      cpu: 200m
    limits:
      memory: 512Mi
      cpu: 500m

  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 24

  livenessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
